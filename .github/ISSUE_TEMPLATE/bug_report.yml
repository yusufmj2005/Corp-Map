name: Bug report
description: Something in CorpMap isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! If a company's parent, subsidiaries or brands are simply missing or wrong,
        that usually comes from Wikidata. Please check the item on wikidata.org first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for "Toyota"
        2. Open Tools → Branches → Brands
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: http://localhost:5173/company/Q53268
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
